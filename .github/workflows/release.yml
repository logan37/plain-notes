name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release plain-notes APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest

      - name: Build Release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare Release Asset
        id: prepare_asset
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [[ "$VERSION" != v* ]]; then
            VERSION="${{ github.event.inputs.version_tag }}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="v1.0.0"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          # Find the built release apk
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            # Fallback to assembleDebug if unsigned release requires keystore
            gradle :app:assembleDebug
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi

          TARGET_APK="plain-notes-${VERSION}.apk"
          cp "$APK_PATH" "$TARGET_APK"
          echo "ASSET_NAME=$TARGET_APK" >> $GITHUB_ENV

      - name: Generate Changelog
        id: changelog
        run: |
          cat << 'EOF' > release_body.md
          # plain-notes Release ${{ env.VERSION }} 🔒📝

          ### ✨ Highlights
          - **Google Keep Alternative**: Clean masonry cards, pastel color palette, and instant search.
          - **Offline-First Storage**: High-performance local SQLite database via Jetpack Room.
          - **Markdown & Interactive Bullets**: Headers, bold, quotes, and tap-to-toggle checklist items.
          - **Zero-Knowledge Encryption**: AES-256-GCM client-side encryption with PBKDF2 key derivation.
          - **Private Cloud & Local Git Sync**: Direct sync with Google Drive, Dropbox, OneDrive, WebDAV, or local Git repositories.

          ### 📦 Installation
          Download and install `plain-notes-${{ env.VERSION }}.apk` attached below.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: plain-notes ${{ env.VERSION }}
          body_path: release_body.md
          files: ${{ env.ASSET_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
